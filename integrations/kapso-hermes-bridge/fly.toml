# Fly.io template for kapso-hermes-bridge
# https://fly.io/docs/reference/configuration/

app = "kapso-hermes-bridge"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  BRIDGE_HOST = "0.0.0.0"
  BRIDGE_PORT = "8787"
  LOG_LEVEL = "INFO"
  IDEMPOTENCY_BACKEND = "sqlite"
  IDEMPOTENCY_DB_PATH = "/data/idempotency.db"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[mounts]]
  source = "kapso_bridge_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
